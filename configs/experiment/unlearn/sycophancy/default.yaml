# @package _global_

defaults:
  - /trainer@relearning_trainer: finetune
  - override /model: Llama-3.2-3B
  # Delete inherited TOFU datasets from base data/unlearn.yaml
  - override /data/datasets@data.forget: null
  - override /data/datasets@data.retain: null
  - override /eval: null  # This disables the default TOFU evaluation
  - override /hydra/sweeper: optuna  # Use Optuna sweeper for --multirun

trainer:
  save_final_state: False
  args:
    report_to: wandb  # none|tensorboard|wandb|dvclive|comet_ml
    run_name: ${task_name}
    do_eval: False
    # 4x smaller batches than the 128-token configs (same token budget at max_length 512)
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 4

tokenizer_cfg:
  max_length: 512  # user prompts alone are ~160 tokens; full chats are ~300 (p90 ~360)

eval:
  wikitext_kl:
    handler: KLEvaluator
    dataset_name: wikitext
    disr_budget: 0.01
  retain_eval:
    handler: KLEvaluator
    dataset_name: retain_eval  # held-out normal-response pairs
    disr_budget: null
  recall_prob:
    handler: ProbabilityEvaluator
    dataset_name: recall  # held-out sycophantic responses (prompt masked)
  normal_prob:
    handler: ProbabilityEvaluator
    dataset_name: normal_probe  # held-out normal responses (retention check)
  fewshot_attack_5:
    handler: FewShotBeaverTailsEvaluator
    num_fewshot: 5
    only_at_relearn_start: true  # run only at the relearn stage's epoch-0 eval
    batch_size: 2  # few-shot contexts are ~1.6k tokens; larger batches OOM
  general_caps:
    handler: LMEvalEvaluator
    only_at_relearn_start: true  # run only at the relearn stage's epoch-0 eval
    # same MMLU subsets as the wmdp_low_mi experiments
    tasks:
      - mmlu_college_biology
      - mmlu_virology
      - mmlu_college_computer_science
      - mmlu_computer_security
      - mmlu_sociology
      - mmlu_philosophy
    aggregate_key: mmlu_total  # micro-averaged accuracy over all tasks
    overwrite: False

data:
  custom_loaders:
    - loader: sycophancy
      num_forget: 250  # texts are ~4x longer than the other benchmarks', so fewer of them
      num_probes: 200
      # num_normal_probes: 20  # optionally you can descrease the number of "normal behavior" probes, to cut 15% of the run cost
      # (subset of the same prompts; normal_prob is observational only, reduced to save cost)
      tokenizer: ${tokenizer_cfg}

    - loader: load_hf_and_tokenize  # wikitext for KL eval
      dataset_name: wikitext
      hf_args:
        path: filypo/wikitext_16k
      range: [0, 128]
      tokenizer: ${tokenizer_cfg}

relearning_trainer:
  # default loaded from finetune.yaml
  save_final_state: False
  handler: FinetuneTrainer
  args:
    per_device_train_batch_size: 2
    per_device_eval_batch_size: 4
    optim: adamw_8bit  # sgd | adamw_8bit | paged_adamw_8bit
    learning_rate: 7e-6
    lr_scheduler_type: constant
    report_to: wandb  # none|tensorboard|wandb|dvclive|comet_ml
    run_name: ${task_name}

metric_to_optimize: recall_prob
optimize_direction: minimize

# Optuna sweeper config (activate with --multirun flag)
hydra:
  sweeper:
    # hyperparam range loaded from /sweep config group in configs/trainer/*.yaml files
    _target_: hydra_plugins.hydra_optuna_sweeper.optuna_sweeper.OptunaSweeper
    max_failure_rate: 0.0
    search_space: null
    custom_search_space: null
    storage: ${oc.env:OPTUNA_STORAGE_URL}
    study_name: ${task_name}
    direction: ${optimize_direction}
    n_trials: 30
    n_jobs: 1
    sampler:
      _target_: optuna.samplers.TPESampler
      seed: ${trainer.args.seed}  # deterministic
