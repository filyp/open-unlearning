model_args:
  pretrained_model_name_or_path: "Qwen/Qwen3.5-9B"
  # attn_implementation: 'flash_attention_2'
  attn_implementation: sdpa  # sdpa saves ~134 MB/full-attn-block; null was only faster for inference on short texts
  torch_dtype: bfloat16
# Freeze vision encoder: saves ~1.6 GB (grads + optimizer states) for text-only tasks
freeze_keywords:
  - visual
tokenizer_args:
  pretrained_model_name_or_path: "Qwen/Qwen3.5-9B"
template_args:
  apply_chat_template: true